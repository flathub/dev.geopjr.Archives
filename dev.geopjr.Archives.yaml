app-id: dev.geopjr.Archives
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: dev.geopjr.Archives
finish-args:
  - --device=dri
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - '*.la'
  - '*.a'
modules:
  - name: archives
    buildsystem: meson
    config-opts:
      - -Doffline_update_bundle=true
    sources:
      - type: git
        url: https://gitlab.gnome.org/GeopJr/Archives.git
        tag: v0.4.0
        commit: c83071cc64ca7119469a08ca69b119ee9be742d1
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: archive
        dest: offline/ruffle/
